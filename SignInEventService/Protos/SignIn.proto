syntax = "proto3";

option csharp_namespace = "SignInEventService.Protos";

import "phoenix/protobuf/date.proto";
import "phoenix/protobuf/guid.proto";

message SignInRequest {
	string player_code = 1;
	phoenix.protobuf.GuidValue promotion_id = 2;
	phoenix.protobuf.DateValue date = 3;
}

message SignInResponse {
	phoenix.protobuf.GuidValue id = 1;
	int32 combo = 2;
}
